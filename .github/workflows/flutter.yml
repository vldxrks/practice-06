name: Flutter verification

on:
  push:
    branches: [main]
    tags: ['stage-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Verify final stage and capture evidence
        run: bash tool/verify.sh
      - name: Verify the lifting stage
        run: |
          git worktree add --detach ../stage-1 stage-1-lifting
          cd ../stage-1
          flutter pub get
          flutter analyze --fatal-infos
          flutter test --reporter expanded
          flutter build web --release
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-evidence
          path: |
            docs/
            README.md
          if-no-files-found: warn
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: counter-web
          path: build/web/
