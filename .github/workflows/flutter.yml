name: Provider practical verification

on:
  push:
    branches: [practice-06-part2]
  pull_request:
    branches: [practice-06-part2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Analyze, test, measure and build
        run: bash tool/verify.sh
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-verification
          path: |
            docs/
            README.md
          if-no-files-found: warn
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: provider-web
          path: build/web/
